name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  snyk:
    name: Snyk security scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for Snyk token
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning title=Snyk skipped::Add a SNYK_TOKEN repository secret to enable security scanning."
          fi
      - uses: pnpm/action-setup@v4
        if: env.SNYK_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.SNYK_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        if: env.SNYK_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - uses: snyk/actions/setup@master
        if: env.SNYK_TOKEN != ''
      - name: Dependency scan (SCA)
        if: env.SNYK_TOKEN != ''
        run: snyk test --all-projects --severity-threshold=high
      - name: Code scan (SAST)
        if: env.SNYK_TOKEN != ''
        run: snyk code test --severity-threshold=high
      - name: Monitor main branch
        if: env.SNYK_TOKEN != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: snyk monitor --all-projects
